[project]
name = "boardgame-recommender"
version = "0.1.0"
description = "머신러닝 기반 보드게임 추천 시스템 (BoardGame Recommender)"
readme = "README.md"
authors = [
    { name = "juny", email = "Nice.juny.lee@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "ruff>=0.17.0",
]

[tool.uv]
package = false
