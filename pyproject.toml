[project]
name = "boardgame-recommender"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "juny", email = "Nice.juny.lee@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
boardgame-recommender = "boardgame_recommender:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
]
